name: Build Windows exe

on:
  workflow_dispatch:          # run manually from the Actions tab
  push:
    tags: ["v*"]              # or push a tag like v1.0.0 to also publish a Release

permissions:
  contents: write             # needed to attach the .exe to a Release

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pyinstaller
      - run: pyinstaller --onefile --noconsole --clean --name BlueStarAC bluestar_app.py
      - uses: actions/upload-artifact@v4
        with:
          name: BlueStarAC-windows
          path: dist/BlueStarAC.exe
      - name: Attach to Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/BlueStarAC.exe
